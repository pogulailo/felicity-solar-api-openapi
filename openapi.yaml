  /app/deviceCommand/create_setting_command:
    post:
      operationId: createSettingCommand
      summary: Send parameter settings to a device
      description: 'Core settings call. deviceCommands items: fieldName (parameter key), groupId, useType,
        paramType (1 observed for plain), dataHandlerType, fieldValue (number; bit-fields are merged client
        side). realContentParam lists the fieldNames. The app also sends fieldName=auten fieldValue=1
        as an authentication/unlock command. Poll /deviceCommand/get_device_command_status with returned
        id.'
      tags:
      - Device Command
      security:
      - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceSn:
                  type: string
                timestamp:
                  type: integer
                  format: int64
                  description: epoch ms
                timeZone:
                  type: string
                oldVersion:
                  type: string
                  description: '"1"'
                useType:
                  type: integer
                groupId:
                  type: integer
                version:
                  type: string
                  description: app version (auten call)
                realContentParam:
                  type: array
                  items:
                    type: string
                deviceCommands:
                  type: array
                  items:
                    type: object
                    properties:
                      fieldName:
                        type: string
                      groupId:
                        type: integer
                      useType:
                        type: integer
                      paramType:
                        type: integer
                      dataHandlerType:
                        type: integer
                      fieldValue:
                        description: number or string
              required:
              - deviceSn
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSettingCommandResponse'
