paths:
  /verification/captcha/get:
    post:
      operationId: captchaGet
      summary: Get block-puzzle captcha
      description: Fetches a slider ("blockPuzzle") captcha image pair. The returned repData.token and
        repData.secretKey are used by captchaCheck.
      tags:
      - Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaGetRequest'
      responses:
        '200':
          description: 'Envelope (HTTP 200 always; check code: 200 ok, 998 token invalid, 1017 maintenance)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaGetResponse'
      security: []
  /verification/captcha/check:
    post:
      operationId: captchaCheck
      summary: Verify captcha slider position
      description: Verifies the slider. pointJson = AES/ECB/PKCS7Padding(Base64, android Base64.DEFAULT)
        of Gson JSON {"x":<sliderXMoved>,"y":5.0} using key = secretKey from captcha/get. The "captchaVerification"
        later passed to verification/code is built by the UI (typically AES(token + "---" + pointJson);
        not verified here).
      tags:
      - Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaCheckRequest'
      responses:
        '200':
          description: 'Envelope (HTTP 200 always; check code: 200 ok, 998 token invalid, 1017 maintenance)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaCheckResponse'
      security: []
  /verification/code:
    post:
      operationId: sendVerificationCode
      summary: Send SMS or e-mail verification code
      description: 'Sends a code to phone (target=phone) or email (target=email) after captcha. useType
        meaning: phone: "1"=register, "2"=reset password, "3", "1003"; email: "1001", "1002"=edit email,
        "3", "1003". (MsgCodeView codeType mapping).'
      tags:
      - Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendVerificationCodeRequest'
      responses:
        '200':
          description: 'Envelope (HTTP 200 always; check code: 200 ok, 998 token invalid, 1017 maintenance)'
