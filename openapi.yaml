                  type: array
                  items:
                    type: integer
                  description: app sends [1,2]
                nowTime:
                  type: string
                  description: yyyy-MM-dd HH:mm:ss
                status:
                  type: string
                  description: 'plant status filter: ""=all, OL online, O offline, E fault, M not monitored
                    (inferred from app enums)'
                plantType:
                  type: string
                  description: HO/IND/BUS/GRO or ""
                onGridType:
                  type: string
                  description: GCO/ES/ICOG/MS/PMTB/MI or ""
                authorized:
                  type: string
                  description: '"1"/"0" or "" (authorized-to-me vs own; inferred)'
