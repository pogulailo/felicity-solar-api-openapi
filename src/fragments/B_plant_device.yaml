  /app/plant/list_plant:
    post:
      operationId: listPlants
      summary: List plants (paged)
      description: Main plant list. Extra filter keys come from the drawer filter UI. noTotalNumber=true skips count.
      tags:
      - Plant
      security:
      - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pageNum:
                  type: integer
                  description: 1-based page number
                pageSize:
                  type: integer
                  description: page size (app uses 10)
                keywords:
                  type: string
                  description: search text
                noTotalNumber:
                  type: boolean
                systemTypes:
                  type: array
                  items:
                    type: integer
                  description: app sends [1,2]
                nowTime:
                  type: string
                  description: yyyy-MM-dd HH:mm:ss
                status:
                  type: string
                  description: 'plant status filter: ""=all, OL online, O offline, E fault, M not monitored (inferred from
                    app enums)'
                plantType:
                  type: string
                  description: HO/IND/BUS/GRO or ""
                onGridType:
                  type: string
                  description: GCO/ES/ICOG/MS/PMTB/MI or ""
                authorized:
                  type: string
                  description: '"1"/"0" or "" (authorized-to-me vs own; inferred)'
                organName:
                  type: string
                realName:
                  type: string
                tagName:
                  type: string
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlantsResponse'
