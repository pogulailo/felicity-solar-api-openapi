paths:
  /app/plant/create_plant:
    post:
      operationId: createPlant
      summary: Create plant
      description: Creates a power station; optionally binds devices in the same call.
      tags:
      - Plant
      security:
      - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                owner:
                  type: string
                  description: target user id (owner of the plant; installer creating for a customer)
                plantName:
                  type: string
                installDate:
                  type: integer
                  format: int64
                  description: epoch ms
                installer:
                  type: string
                pictures:
                  type: string
                  description: picture file ids/urls
                countryName:
                  type: string
                countryId:
                  type: string
                provinceName:
                  type: string
                provinceId:
                  type: string
                cityName:
                  type: string
                cityId:
                  type: string
                address:
                  type: string
                longitude:
                  type: string
                latitude:
                  type: string
                timeZone:
                  type: string
                  description: sent as businessTimeZone instead when dstFlag=true
                businessTimeZone:
                  type: string
                  description: used instead of timeZone when dstFlag=true
                electricityPrice:
                  type: string
                currency:
                  type: string
                tagIds:
                  type: array
                  items:
                    type: string
                  description: tag ids
                plantType:
                  type: string
                  description: HO household, IND industrial, BUS business, GRO ground
                onGridType:
                  type: string
                  description: GCO, ES, ICOG, MS, PMTB, MI
                dstFlag:
                  type: boolean
                  description: daylight saving time
                deviceList:
                  type: array
                  items:
                    $ref: '#/components/schemas/DeviceSaveEntity'
                  description: devices to bind
              required:
              - plantName
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlantResponse'
  /app/plant/update_plant:
    post:
      operationId: updatePlant
      summary: Update plant
      description: Edit plant properties.
      tags:
      - Plant
      security:
      - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: plant id
                plantId:
                  type: string
                  description: same as id
                plantName:
                  type: string
                installDate:
                  type: integer
                  format: int64
                  description: epoch ms
                installer:
                  type: string
                pictures:
                  type: string
                  description: picture file ids/urls
                countryName:
                  type: string
                countryId:
                  type: string
                provinceName:
                  type: string
                provinceId:
                  type: string
                cityName:
                  type: string
                cityId:
                  type: string
                address:
                  type: string
                longitude:
                  type: string
                latitude:
                  type: string
                timeZone:
                  type: string
                  description: sent as businessTimeZone instead when dstFlag=true
                businessTimeZone:
                  type: string
                  description: used instead of timeZone when dstFlag=true
                electricityPrice:
                  type: string
                currency:
                  type: string
                tagIds:
                  type: array
                  items:
                    type: string
                  description: tag ids
                plantType:
                  type: string
                  description: HO household, IND industrial, BUS business, GRO ground
                onGridType:
                  type: string
                  description: GCO, ES, ICOG, MS, PMTB, MI
                dstFlag:
                  type: boolean
                  description: daylight saving time
              required:
              - id
              - plantName
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePlantResponse'
  /app/plant/delete_plant:
    post:
      operationId: deletePlant
