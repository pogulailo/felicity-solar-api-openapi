    post:
      operationId: ecoTaskUpdate
      summary: Update eco task
      tags:
      - Eco
      description: Same body as save plus id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                taskName:
                  type: string
                taskType:
                  type: string
                  enum:
                  - tag
                  - plant
                  - device
                targetList:
                  type: array
                  items:
                    type: object
                    properties:
