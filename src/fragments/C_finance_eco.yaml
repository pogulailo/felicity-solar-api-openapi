    get:
      operationId: financeReferrerMy
      summary: My referrer profile
      tags:
      - Finance
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceReferrerResponse'
  /app/finance/referrer/register:
    post:
      operationId: financeReferrerRegister
      summary: Register as referrer
      tags:
      - Finance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                emailCheckCode:
                  type: string
                name:
                  type: string
                bankCard:
                  type: string
                parentReferralCode:
                  type: string
              description: Empty values omitted by client.
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
  /app/finance/referrer/update:
    post:
      operationId: financeReferrerUpdate
      summary: Update referrer bank card
      tags:
      - Finance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                bankCard:
                  type: string
              required:
              - id
              - bankCard
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
  /app/finance/commission/list:
    post:
      operationId: financeCommissionList
      summary: List commission settlement orders
      tags:
      - Finance
      description: Paged commission settlement orders (CommissionListRootEntity). Extra filter keys may be merged from a UI-built
        map (not statically determined).
      requestBody:
        required: true
