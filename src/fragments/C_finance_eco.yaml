          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsDevicePointPageResponse'
  /app/points/apply/check/device:
    get:
      operationId: pointsApplyCheckDevice
      summary: Check a device is eligible for a points application
      tags:
      - Points
      description: activity is fixed to "2" by the client.
      parameters:
      - name: activity
        in: query
        required: false
        schema:
          type: string
      - name: deviceSn
        in: query
        required: false
        schema:
          type: string
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: existing application id when editing
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
  /app/points/apply/submit:
    post:
      operationId: pointsApplySubmit
      summary: Create/update a points application
      tags:
      - Points
      description: 'activity selects the form: 2 = install application (deviceSnList,address,phone...), 3 = feedback/question
        (deviceSnList=[sn],questionType,remark), 4 = Trustpilot review (userName,trustpilotUrl). files is a comma separated
        string of uploaded file ids (no brackets).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activity:
                  type: integer
                id:
                  type: string
                deviceSnList:
                  type: array
                  items:
                    type: string
                countryId:
                  type: string
                countryName:
                  type: string
                address:
                  type: string
                email:
                  type: string
                phoneZone:
                  type: string
                phone:
                  type: string
                remark:
                  type: string
                questionType:
                  type: string
                userName:
                  type: string
                trustpilotUrl:
                  type: string
                files:
                  type: string
              required:
              - activity
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
