paths:
  /app/finance/load/apply/list:
    post:
      operationId: financeLoanApplyList
      summary: List loan applications
      tags:
      - Finance
      description: Installer/referrer view (no userId). The app also sends userId = current UID for the personal list (same
        endpoint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pageNum:
                  type: integer
                pageSize:
                  type: integer
                keywords:
                  type: string
                userId:
                  type: string
              required:
              - pageNum
              - pageSize
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceLoanApplyPageResponse'
  /app/finance/load/apply/submit:
    post:
      operationId: financeLoanApplySubmit
      summary: Submit a customer loan application
      tags:
      - Finance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                applyTime:
                  type: string
                batteryCapacity:
                  type: string
                customerNo:
                  type: string
                email:
                  type: string
                inverterPower:
                  type: string
                name:
                  type: string
                occupation:
                  type: string
                phone:
                  type: string
                referralCode:
                  type: string
              description: All fields optional; empty strings are omitted by the client. applyTime is a date string.
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceLoanApplyResponse'
  /app/finance/load/apply/detail/{id}:
    get:
      operationId: financeLoanApplyDetail
      summary: Loan application detail
      tags:
      - Finance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Loan application id
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceLoanApplyDetailResponse'
  /app/finance/load/apply/check/code/{code}:
    get:
      operationId: financeLoanApplyCheckCode
      summary: Validate a referral code
      tags:
      - Finance
      description: Returns success envelope if the referral code exists (data unused).
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
        description: Referral code
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
  /app/finance/load/apply/approve:
    post:
      operationId: financeLoanApplyApprove
      summary: Approve or reject a loan application (reviewer)
      tags:
      - Finance
      description: 'Used for two flows: reject (status=3 with rejectReason) and approve (status=2 with contract data).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                status:
                  type: integer
                rejectReason:
                  type: string
                contractNo:
                  type: string
                transferRecordFile:
                  type: string
                contractFile:
                  type: string
                repaymentNum:
                  type: integer
                firstRepaymentDate:
                  type: string
                loanAmount:
                  type: integer
              required:
              - id
              - status
              description: 'Reject: id,status=3,rejectReason. Approve: id,status=2,contractNo,transferRecordFile(file id),contractFile(file
                id),repaymentNum,firstRepaymentDate,loanAmount.'
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
  /app/finance/load/apply/cancel/{id}:
    get:
      operationId: financeLoanApplyCancel
      summary: Cancel a loan application
      tags:
      - Finance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
  /app/finance/load/apply/delivery:
    post:
      operationId: financeLoanApplyDelivery
      summary: Submit delivery proof for a loan application
      tags:
      - Finance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                deliveryRemark:
                  type: string
                deliveryTime:
                  type: string
                deliveryProofFileIds:
                  type: array
                  items:
                    type: string
              required:
              - id
              description: deliveryProofFileIds are uploaded file ids.
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
  /app/finance/bank/info/contact:
    get:
      operationId: financeBankContact
      summary: Finance support contact
      tags:
      - Finance
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceContactResponse'
  /app/finance/bank/info/list:
    post:
      operationId: financeBankBranchList
      summary: List bank branches
      tags:
      - Finance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pageNum:
                  type: integer
                pageSize:
                  type: integer
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceBankBranchPageResponse'
