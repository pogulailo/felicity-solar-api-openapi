  /app/ecoTask/save_ecoTask:
    post:
      operationId: ecoTaskSave
      summary: Create eco task
      tags:
      - Eco
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskName:
                  type: string
                taskType:
                  type: string
                  enum:
                  - tag
                  - plant
                  - device
                targetList:
                  type: array
                  items:
                    type: object
                    properties:
                      tagId:
                        type: string
                      plantId:
                        type: string
                      deviceId:
                        type: string
                    description: one of tagId/plantId/deviceId depending on taskType
                templateId:
                  type: string
      security:
      - ApiToken: []
      responses:
        '200':
          description: Envelope; code 200 = success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcoAnyDataResponse'
