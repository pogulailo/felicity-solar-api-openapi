paths:
  "/app/customerComplaintOrder/getCustomerComplaintOrderList":
    post:
      operationId: "getCustomerComplaintOrderList"
      summary: "List customer complaint orders"
      description: "Paged search of complaint (service) orders. Extra filter keys come from a UI search map and are merged into the body; productTypeIds and productModels, if present, are wrapped as a single-element string array."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                pageNum:
                  type: "integer"
                  description: "1-based page number"
                pageSize:
                  type: "integer"
                  description: "page size"
                keywords:
                  type: "string"
                  description: "search keywords (optional)"
                productTypeIds:
                  type: "array"
                  items:
                    type: "string"
                productModels:
                  type: "array"
                  items:
                    type: "string"
                "<other filters>":
                  type: "string"
                  description: "additional filter keys from search UI; names not statically determined"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderListResponse"
  "/app/customerComplaintOrder/getCustomerComplaintOrderDetail":
    post:
      operationId: "getCustomerComplaintOrderDetail"
      summary: "Get complaint order detail"
      description: "Returns one complaint order with files, handles, operations and permission flags."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                  description: "order id"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderDetailResponse"
  "/app/customerComplaintOrder/getCustomerComplaintReplyList":
    post:
      operationId: "getCustomerComplaintReplyList"
      summary: "List complaint order replies"
      description: "Paged replies (messages) of a complaint order."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                pageNum:
                  type: "integer"
                  description: "1-based page number"
                pageSize:
                  type: "integer"
                  description: "page size"
                id:
                  type: "string"
                  description: "order id"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintReplyListResponse"
  "/app/customerComplaintOrder/save_customerComplaintOrder":
    post:
      operationId: "saveCustomerComplaintOrder"
      summary: "Create complaint order"
      description: "Creates a new complaint order. The same client method calls update_customerComplaintOrder (with id) when editing."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                responsibleUserId:
                  type: "string"
                  description: "current user id (UID from preferences)"
                flowNodesType:
                  type: "integer"
                  description: "1 overseas CS, 2 domestic CS, 3 engineer, 4 R&D"
                countryName:
                  type: "string"
                customerContact:
                  type: "string"
                contactAddress:
                  type: "string"
                questionDesc:
                  type: "string"
                productTypeIds:
                  type: "array"
                  items:
                    type: "integer"
                productModelDeviceSns:
                  type: "object"
                  description: "map deviceModel -> list of device SNs"
                  additionalProperties:
                    type: "array"
                    items:
                      type: "string"
                files:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      fileId:
                        type: "string"
                      type:
                        type: "string"
                      fileType:
                        type: "string"
                      fileUrl:
                        type: "string"
                    description: "Subset of FileResponseEntity: fileId, type, fileType, fileUrl"
                priority:
                  type: "integer"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderSaveResponse"
  "/app/customerComplaintOrder/update_customerComplaintOrder":
    post:
      operationId: "updateCustomerComplaintOrder"
      summary: "Update complaint order"
      description: "Updates an existing complaint order; body identical to create plus id."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                responsibleUserId:
                  type: "string"
                  description: "current user id (UID from preferences)"
                flowNodesType:
                  type: "integer"
                  description: "1 overseas CS, 2 domestic CS, 3 engineer, 4 R&D"
                countryName:
                  type: "string"
                customerContact:
                  type: "string"
                contactAddress:
                  type: "string"
                questionDesc:
                  type: "string"
                productTypeIds:
                  type: "array"
                  items:
                    type: "integer"
                productModelDeviceSns:
                  type: "object"
                  description: "map deviceModel -> list of device SNs"
                  additionalProperties:
                    type: "array"
                    items:
                      type: "string"
                files:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      fileId:
                        type: "string"
                      type:
                        type: "string"
                      fileType:
                        type: "string"
                      fileUrl:
                        type: "string"
                    description: "Subset of FileResponseEntity: fileId, type, fileType, fileUrl"
                priority:
                  type: "integer"
                id:
                  type: "string"
                  description: "order id"
              required:
                - "id"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderUpdateResponse"
  "/app/customerComplaintOrder/deleteCustomerComplaintOrder":
    post:
      operationId: "deleteCustomerComplaintOrder"
      summary: "Delete complaint order"
      description: "Deletes a complaint order by id."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderDeleteResponse"
  "/app/customerComplaintOrder/delete_customerComplaintHandle":
    post:
      operationId: "deleteCustomerComplaintHandle"
      summary: "Delete complaint handling record"
      description: "Deletes a handling record (ComplaintHandle) by its id."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                  description: "handle record id"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintHandleDeleteResponse"
  "/app/customerComplaintOrder/assignOrder":
    post:
      operationId: "assignComplaintOrder"
      summary: "Assign complaint order"
      description: "Assigns/transfers an order to one or more responsible users and sets flow node/priority."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                  description: "order id"
                flowNodesType:
                  type: "integer"
                  description: "1 overseas CS, 2 domestic CS, 3 engineer, 4 R&D"
                priority:
                  type: "integer"
                notes:
                  type: "string"
                responsibleUserId:
                  type: "string"
                  description: "comma-separated user ids (list ids joined with \",\"; also a single id)"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderAssignResponse"
  "/app/customerComplaintOrder/handleOrder":
    post:
      operationId: "handleComplaintOrder"
      summary: "Handle complaint order"
      description: "Submits a handling/solution step for an order."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                  description: "order id"
                solutionType:
                  type: "integer"
                status:
                  type: "integer"
                  description: "optional, sent only when >= 0"
                notes:
                  type: "string"
                files:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      fileId:
                        type: "string"
                      type:
                        type: "string"
                      fileType:
                        type: "string"
                      fileUrl:
                        type: "string"
                    description: "Subset of FileResponseEntity: fileId, type, fileType, fileUrl"
                deviceSn:
                  type: "string"
                reviewerUserId:
                  type: "string"
                executorUserId:
                  type: "string"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderHandleResponse"
  "/app/customerComplaintOrder/replyOrder":
    post:
      operationId: "replyComplaintOrder"
      summary: "Reply to complaint order"
      description: "Adds a reply (and optional files / new responsible user) to an order; returns the created reply."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                  description: "order id"
                notes:
                  type: "string"
                  description: "reply text"
                responsibleUserId:
                  type: "string"
                files:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      fileId:
                        type: "string"
                      type:
                        type: "string"
                      fileType:
                        type: "string"
                      fileUrl:
                        type: "string"
                    description: "Subset of FileResponseEntity: fileId, type, fileType, fileUrl"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderReplyResponse"
  "/app/customerComplaintOrder/reviewOrder":
    post:
      operationId: "reviewComplaintOrder"
      summary: "Review (audit) complaint order"
      description: "Approves/rejects an order."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                reviewStatus:
                  type: "string"
                  description: "review result code (values not determined)"
                rejectReason:
                  type: "string"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ComplaintOrderReviewResponse"
  "/app/customerComplaintOrder/getDeviceSnByModel":
    post:
      operationId: "getDeviceSnByModel"
      summary: "List device SNs by model"
      description: "Paged lookup of device serial numbers for a product model (page 1)."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                deviceModel:
                  type: "string"
                deviceSn:
                  type: "string"
                  description: "search text"
                pageNum:
                  type: "integer"
                pageSize:
                  type: "integer"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceSnByModelResponse"
  "/app/customerComplaintOrder/getProductModelList":
    post:
      operationId: "getProductModelList"
      summary: "List product models"
      description: "Returns product models matching the text."
      tags:
        - "Complaint"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                deviceModel:
                  type: "string"
                  description: "search text"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ProductModelListResponse"
  "/app/feedBack/details":
    post:
      operationId: "getFeedbackDetails"
      summary: "Get feedback (after-sales) detail"
      description: "Detail of a feedback/rescue ticket. The client optionally also sends scope."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                  description: "feedback id"
                scope:
                  type: "integer"
                  description: "optional view scope"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackDetailResponse"
  "/app/feedBack/submit_device":
    post:
      operationId: "submitFeedbackDevice"
      summary: "Submit device feedback"
      description: "Creates a feedback about a device (no id given). The same client method hits /app/feedBack/update when id is given."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                deviceSn:
                  type: "string"
                plantId:
                  type: "string"
                subject:
                  type: "string"
                description:
                  type: "string"
                notes:
                  type: "string"
                countryId:
                  type: "string"
                countryName:
                  type: "string"
                provinceId:
                  type: "string"
                provinceName:
                  type: "string"
                cityId:
                  type: "string"
                cityName:
                  type: "string"
                deviceAddress:
                  type: "string"
                files:
                  type: "array"
                  items:
                    type: "string"
                    description: "uploaded file id"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackSubmitDeviceResponse"
  "/app/feedBack/update":
    post:
      operationId: "updateFeedback"
      summary: "Edit device feedback"
      description: "Edits an existing feedback; same fields as submit_device plus id, coverFlag=true and coverFileIds replacing files."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                coverFlag:
                  type: "boolean"
                  description: "always true"
                coverFileIds:
                  type: "array"
                  items:
                    type: "string"
                deviceSn:
                  type: "string"
                plantId:
                  type: "string"
                subject:
                  type: "string"
                description:
                  type: "string"
                notes:
                  type: "string"
                countryId:
                  type: "string"
                countryName:
                  type: "string"
                provinceId:
                  type: "string"
                provinceName:
                  type: "string"
                cityId:
                  type: "string"
                cityName:
                  type: "string"
                deviceAddress:
                  type: "string"
              required:
                - "id"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackUpdateResponse"
  "/app/fedBack/submit_System":
    post:
      operationId: "submitFeedbackSystem"
      summary: "Submit system feedback (multipart)"
      description: "Submits a system/app feedback with attachments. multipart/form-data, files in part \"files\". Timeout 30s."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              properties:
                userName:
                  type: "string"
                phone:
                  type: "string"
                email:
                  type: "string"
                subject:
                  type: "string"
                description:
                  type: "string"
                files:
                  type: "array"
                  items:
                    type: "string"
                    format: "binary"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackSubmitSystemResponse"
  "/app/fedBack/history_list":
    post:
      operationId: "getFeedbackHistoryList"
      summary: "List feedback history"
      description: "Paged list of the user's feedback tickets (note path spelling \"fedBack\")."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                pageNum:
                  type: "integer"
                  description: "1-based page number"
                pageSize:
                  type: "integer"
                  description: "page size"
                fedBackType:
                  type: "integer"
                  description: "feedback type"
                handleStatus:
                  type: "string"
                  description: "optional status filter, 0..4"
                getAssignMe:
                  type: "boolean"
                  description: "only sent when true: tickets assigned to me"
                keywords:
                  type: "string"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackHistoryListResponse"
  "/feedBackRecord/list_feedBack_record":
    post:
      operationId: "listFeedbackRecord"
      summary: "List feedback conversation messages"
      description: "Paged messages of a feedback ticket. NOTE path has no /app prefix."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                feedBackId:
                  type: "string"
                pageNum:
                  type: "integer"
                pageSize:
                  type: "integer"
                  default: 10
                timeZone:
                  type: "string"
                  description: "device default time zone id"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackRecordListResponse"
  "/app/feedBack/crate_feedback_record":
    post:
      operationId: "createFeedbackRecord"
      summary: "Post feedback message (multipart)"
      description: "Adds a message (text and/or files) to a feedback ticket (path typo \"crate\" is real). multipart/form-data, files in part \"file\"."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              properties:
                feedBackId:
                  type: "string"
                content:
                  type: "string"
                type:
                  type: "string"
                  description: "message type"
                timeZone:
                  type: "string"
                file:
                  type: "array"
                  items:
                    type: "string"
                    format: "binary"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackRecordCreateResponse"
  "/app/feedBack/examiner_after_sales":
    post:
      operationId: "examineAfterSales"
      summary: "Verify (accept) after-sales ticket"
      description: "Accept/reject the handling result of a ticket."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                feedBackId:
                  type: "string"
                notes:
                  type: "string"
                examinerStatus:
                  type: "integer"
                  description: "verification result code (values not determined)"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackExaminerResponse"
  "/app/feedBack/assign_after_sales":
    post:
      operationId: "assignAfterSales"
      summary: "Assign after-sales ticket"
      description: "Assigns a feedback ticket to an after-sales user."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                responsibleUserId:
                  type: "string"
                feedBackId:
                  type: "string"
                discretion:
                  type: "string"
                  description: "assignment remark"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackAssignResponse"
  "/app/feedBackEvaluate/save_feedBackEvaluate":
    post:
      operationId: "saveFeedbackEvaluate"
      summary: "Rate a finished feedback"
      description: "Submits star ratings (floats) for a ticket."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                feedBackId:
                  type: "string"
                evaluateTotal:
                  type: "number"
                  format: "float"
                evaluateRespond:
                  type: "number"
                  format: "float"
                evaluateQuality:
                  type: "number"
                  format: "float"
                evaluateEfficient:
                  type: "number"
                  format: "float"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackEvaluateResponse"
  "/app/feedBackHandle/list_feedBackHandle":
    post:
      operationId: "listFeedbackHandle"
      summary: "List feedback handling records"
      description: "Paged handling (maintenance) records of a ticket."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                pageNum:
                  type: "integer"
                  description: "1-based page number"
                pageSize:
                  type: "integer"
                  description: "page size"
                feedBackId:
                  type: "string"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackHandleListResponse"
  "/app/feedBackHandle/save_feedBackHandle":
    post:
      operationId: "saveFeedbackHandle"
      summary: "Save feedback handling record"
      description: "Adds a handling/maintenance record to a ticket."
      tags:
        - "Feedback"
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                feedBackId:
                  type: "string"
                name:
                  type: "string"
                phoneZone:
                  type: "string"
                phone:
                  type: "string"
                maintenanceTime:
                  type: "integer"
                  description: "epoch ms"
                  format: "int64"
                timePeriod:
                  type: "string"
                handleType:
                  type: "string"
                handleDesc:
                  type: "string"
                newDeviceSn:
                  type: "string"
                handleStatus:
                  type: "integer"
                fileIds:
                  type: "array"
                  items:
                    type: "string"
      responses:
        "200":
          description: "Envelope with code/message/data"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/FeedbackHandleSaveResponse"
  "/app/feedBack/list":
    post:
      operationId: "listFeedbackHandleTickets"
      summary: "List feedback tickets (staff view)"
      description: "Paged ticket list for handlers; extra filter keys merged from a search map."
      tags:
        - "Feedback"
      security:
